name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p _site
          cp -r .github/index.html _site/
          cp -r .github/style.css _site/
          cp -r .github/app.js _site/
          cp -r .github/privacy.html _site/
          cp -r .github/contact.html _site/
          cp -r .github/fonts.css _site/
          cp -r .github/fonts _site/
          cp -r .github/favicon _site/
          cp -r .github/favicon.ico _site/
          cp -r .github/logo.png _site/
          cp -r .github/logo.webp _site/
          cp -r .github/logo-small.webp _site/
          cp -r .github/logo-small.png _site/
          cp -r .github/robots.txt _site/
          cp -r .github/sitemap.xml _site/
          cp -r .github/llms.txt _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
